<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Heart Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <div class="topline">A LITTLE BIT OF CODE, A LOT OF HEART</div>
    <section class="heart-stage" aria-label="Animated heart made of text">
      <div id="heart" class="heart" aria-hidden="true"></div>
    </section>
    <p class="caption" id="caption">Building something special…</p>
    <button id="replay" type="button">Replay animation ↻</button>
    <div class="hint">HTML · CSS · JavaScript</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
