<html>
    <head>
        <title>
         Login
        </title>
        <img href="photo.jpg"  rel="icon">

    <script>
        function login() {
            let user = document.getElementById("userid").value;
            let pass = document.getElementById("password").value;

            if (user !== "" && isNaN(Number(user)) &&
                pass !== "" && !isNaN(Number(pass))) {

                window.location.href = "heart/index.html";

            } else {
                alert("Invalid User ID or Password!");
            }
        }

    </script>
    <style>
      .box {
    transition: transform 0.3s ease;
}

.box:hover {
    transform: translateY(-10px);
}
        #NS{
         margin-left:600px;
         margin-top: 250px ;
        }
        #km{
          background-color: rgba(0, 255, 255, 0.5);
          border-radius: 20px ;
          height: 250px ;
           width: 300px ;
            box-shadow: 5px 5px 35px gray;
        }
        #nn{
          text-align: center;
        }
        #ram{
          padding: 5px ;
          font-size:25px ;
        }
        #rama{
          padding: 5px ;
          font-size:25px ;
        }
        #userid{
          padding: 4px ;
           border-radius: 10px;
        }
         #password{
          padding: 4px ;
          width: 145px ;
          border-radius: 10px;
        }
        #pp{
          height: 30px;
          width: 80px ;
          border-radius:20px  ;
          background-color: whitesmoke;
          border: 5px  black;
          box-shadow: 0px, 0px, 0px, 30px  whitesmoke;
        }
        #cs{
            background-image:
        linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)),
        url("photo.jpg");
        
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
        }
    </style>
    </head>
    <body id="cs">
        <div class="box" id="NS">
        <fieldset    id="km" >
            <legend ></legend>
            <form>
              <h1 id="nn"><i>Login</i></h1>
              
        
                 <label id="ram"><i>UserId</i></label><input  id="userid" type="text" placeholder="Enter Your UserID" required autofocus tabindex="1">
                 <br>
                 <br>
                 <label id="rama"><i>Password</i></label><input id="password" type="password" placeholder="Enter Your Password" required autofocus tabindex="2">
 <br>
                 <br>
                 <button id="pp" onclick="login()" type="button">Login</button>
              
                 <button id="pp" type="reset">Clear</button>
                 

            </form>
        </fieldset>
        </div>
    </body>
</html>
